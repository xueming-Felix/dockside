    <div id="cap-1" class="clip" data-start="5.967" data-duration="0.9"><div class="cap"><span>warehouse door.</span></div></div>
    <div id="cap-2" class="clip" data-start="6.867" data-duration="1.533"><div class="cap"><span>Today that's a phone call,</span></div></div>
    <div id="cap-3" class="clip" data-start="8.367" data-duration="2.2"><div class="cap"><span>and when something goes wrong it's six</span></div></div>
    <div id="cap-4" class="clip" data-start="10.567" data-duration="0.733"><div class="cap"><span>phone calls.</span></div></div>
    <div id="cap-5" class="clip" data-start="11.267" data-duration="1.667"><div class="cap"><span>This is Pier 9 Cold Storage:</span></div></div>
    <div id="cap-6" class="clip" data-start="12.9" data-duration="1.5"><div class="cap"><span>six doors, twelve trucks,</span></div></div>
    <div id="cap-7" class="clip" data-start="14.367" data-duration="2.333"><div class="cap"><span>and eight companies whose agents are all</span></div></div>
    <div id="cap-8" class="clip" data-start="16.667" data-duration="0.933"><div class="cap"><span>on Agent Relay.</span></div></div>
    <div id="cap-9" class="clip" data-start="17.567" data-duration="2.167"><div class="cap"><span>We won't touch the keyboard except to</span></div></div>
    <div id="cap-10" class="clip" data-start="19.7" data-duration="1.067"><div class="cap"><span>break things.</span></div></div>
    <div id="cap-11" class="clip" data-start="21.667" data-duration="2"><div class="cap"><span>Two carriers just asked for door 4</span></div></div>
    <div id="cap-12" class="clip" data-start="23.633" data-duration="2.067"><div class="cap"><span>at two o'clock in the same instant.</span></div></div>
    <div id="cap-13" class="clip" data-start="25.667" data-duration="1.667"><div class="cap"><span>The dock is a Durable Actor,</span></div></div>
    <div id="cap-14" class="clip" data-start="27.3" data-duration="1.3"><div class="cap"><span>one request at a time,</span></div></div>
    <div id="cap-15" class="clip" data-start="28.567" data-duration="1.467"><div class="cap"><span>so it can't double-book.</span></div></div>
    <div id="cap-16" class="clip" data-start="30" data-duration="1.967"><div class="cap"><span>One got it, one got three o'clock.</span></div></div>
    <div id="cap-17" class="clip" data-start="31.967" data-duration="1.7"><div class="cap"><span>Now watch the one who lost go</span></div></div>
    <div id="cap-18" class="clip" data-start="33.633" data-duration="2.233"><div class="cap"><span>straight to the winner with cash.</span></div></div>
    <div id="cap-19" class="clip" data-start="36.767" data-duration="2.3"><div class="cap"><span>A hundred and fifty dollars changed hands,</span></div></div>
    <div id="cap-20" class="clip" data-start="39.033" data-duration="1.867"><div class="cap"><span>the actor swapped them atomically,</span></div></div>
    <div id="cap-21" class="clip" data-start="40.867" data-duration="1.4"><div class="cap"><span>and nobody asked us.</span></div></div>
    <div id="cap-22" class="clip" data-start="43.167" data-duration="1.8"><div class="cap"><span>The broker's truck just checked in at</span></div></div>
    <div id="cap-23" class="clip" data-start="44.933" data-duration="0.4"><div class="cap"><span>door 1.</span></div></div>
    <div id="cap-24" class="clip" data-start="45.3" data-duration="0.9"><div class="cap"><span>Remember it.</span></div></div>
    <div id="cap-25" class="clip" data-start="47.1" data-duration="0.5"><div class="cap"><span>Traffic.</span></div></div>
    <div id="cap-26" class="clip" data-start="47.567" data-duration="2.033"><div class="cap"><span>Two of Carrier A's trucks are ninety</span></div></div>
    <div id="cap-27" class="clip" data-start="49.567" data-duration="2.133"><div class="cap"><span>minutes out, so two slots just opened,</span></div></div>

    <div id="cap-30" class="clip" data-start="54.933" data-duration="1.933"><div class="cap"><span>That close was an alarm inside the</span></div></div>

    <div id="cap-36" class="clip" data-start="64.567" data-duration="0.867"><div class="cap"><span>Door 5 is out.</span></div></div>

    <div id="cap-41" class="clip" data-start="71.9" data-duration="1.867"><div class="cap"><span>Two hundred dollars, two rounds,</span></div></div>
    <div id="cap-42" class="clip" data-start="73.767" data-duration="2.533"><div class="cap"><span>and the board re-plans around the deal.</span></div></div>
    <div id="cap-43" class="clip" data-start="77.2" data-duration="1.867"><div class="cap"><span>An unknown carrier wants a door for</span></div></div>
