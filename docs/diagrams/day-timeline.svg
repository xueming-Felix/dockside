<svg viewBox="0 0 720 300" role="img" aria-label="Timeline from 10:00 to 17:00 with three lanes. Person A: setup, contract, actor core, alarms and deploy, lunch, dashboard, integration, README and Freestyle, final run, judging. Person B: setup, contract, Relay spike, dispatcher on mock, personas, lunch, scenario runner and end-to-end, integration, backup video, Devpost, judging. Sync points at 11:20 contract frozen, 12:30 actor deployed, 14:30 first full run, 16:00 submit." xmlns="http://www.w3.org/2000/svg" width="720" height="300"><style>svg { font-family: 'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif; background: #FFFFFF }
